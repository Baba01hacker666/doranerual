name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of burning runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Test Suite (CPython ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Report Compiler and CPU Dispatch Path
        run: |
          echo "g++: $(g++ --version | head -1)"
          echo "nproc: $(nproc)"
          python -c "import doraneural as dn; print('CPU arch:', dn.get_cpu_arch()); print('Backend:', dn.get_cpu_backend())"

      - name: Build Native C++ Engine
        run: |
          python -c "import doraneural as dn; dn.build_cpp_library(force=True)"
          python -c "import doraneural as dn; assert dn.is_cpp_available(), 'native engine did not build'"

      - name: Run Test Suite
        # AGENTS.md Rule 2: the suite must be 100% green before anything lands on main.
        run: python -m pytest -q -rs

  sanitizers:
    name: Native Engine (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Build Native Engine with ASan and UBSan
        run: |
          g++ -shared -fPIC -std=c++17 -fopenmp -O1 -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined \
            -o doraneural/csrc/libdoraneural.so \
            doraneural/csrc/llm_engine.cpp

      - name: Run Engine Tests under Sanitizers
        # A ctypes FFI segfault with no argtypes registered only manifests when the
        # engine pointer is allocated above 0xFFFFFFFF. Sanitizer builds place it
        # high in the address space, which is how run 37749375880 was diagnosed.
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          LIBASAN=$(gcc -print-file-name=libasan.so)
          echo "Using $LIBASAN"
          LD_PRELOAD="$LIBASAN" python -m pytest -q \
            tests/test_prefill_batching.py \
            tests/test_llm_optimizations.py \
            tests/test_full_transformer_backprop.py

  portability:
    name: Scalar + ARM64 Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Scalar Baseline (no AVX2, no AVX-512)
        # AGENTS.md Rule 3: every SIMD path needs a scalar fallback. Compiling with
        # -mno-avx2 -mno-avx512f forces the #else branches.
        run: |
          g++ -fsyntax-only -std=c++17 -fopenmp -mno-avx2 -mno-avx512f \
            doraneural/csrc/llm_engine.cpp

      - name: ARM64 Cross-Compile (aarch64)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu
          aarch64-linux-gnu-g++ -fsyntax-only -std=c++17 \
            -I doraneural/csrc doraneural/csrc/llm_engine.cpp
          aarch64-linux-gnu-g++ -fsyntax-only -std=c++17 \
            -I doraneural/csrc doraneural/csrc/pulse_engine.cpp

      - name: No Unguarded x86 Intrinsics
        run: |
          # Every _mm*/__m256/__m512/AVX intrinsic must sit inside a
          # defined(__AVX2__) / defined(__AVX512F__) guard.
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for path in pathlib.Path("doraneural/csrc").glob("*.cpp"):
              lines = path.read_text().splitlines()
              depth = 0
              for i, line in enumerate(lines, 1):
                  s = line.strip()
                  if re.match(r"#if", s):
                      depth += 1
                  elif re.match(r"#endif", s):
                      depth = max(0, depth - 1)
                  elif depth == 0 and re.search(r"(_mm512?_|\b__m(256|512)\b|_mm_)", line):
                      bad.append(f"{path}:{i}: {s[:70]}")
          if bad:
              print("Unguarded x86 intrinsics found:")
              print("\n".join(bad))
              sys.exit(1)
          print("OK: all x86 intrinsics are guarded")
          PY