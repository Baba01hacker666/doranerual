name: Train Zexo AI & Continuous Checkpointing

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Zexo architectural tier (micro, mini, chat, base, large)"
        required: false
        default: "mini"
        type: choice
        options:
          - micro
          - mini
          - chat
          - base
          - large
      dataset:
        description: "Path to training dialogue file or Hugging Face dataset ID"
        required: false
        default: "zexo/data/zexo_quality_v1_train.txt"
        type: string
      hf_dataset:
        description: "Hugging Face dataset identifier (e.g. 'roneneldan/TinyStories' or custom ID) to auto-download"
        required: false
        default: ""
        type: string
      hf_samples:
        description: "Max samples to download from Hugging Face (-1 = all)"
        required: false
        default: "-1"
        type: string
      from_scratch:
        description: "Initialize fresh base weights from scratch rather than resuming cached checkpoint"
        required: false
        default: false
        type: boolean
      epochs:
        description: "Number of training epochs"
        required: false
        default: "5"
        type: string
      learning_rate:
        description: "Learning rate for parameter updates"
        required: false
        default: "0.0003"
        type: string
      seq_len:
        description: "Sequence chunk length"
        required: false
        default: "128"
        type: string
      fast:
        description: "Enable fast mode (all CPU cores, OpenMP parallelization, unbuffered streaming)"
        required: false
        default: true
        type: boolean
      test_prompt:
        description: "Test prompt to evaluate conversational response before and after training"
        required: false
        default: "User: Who are you?\nZexo:"
        type: string
      push_checkpoint_to_git:
        description: "Commit updated checkpoint back to repository"
        required: false
        default: false
        type: boolean

  push:
    paths:
      - 'zexo/data/**'
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  train-zexo:
    name: Continuous Zexo AI Training
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build C++ OpenMP Acceleration Engine
        run: |
          python -c "import doraneural as dn; dn.build_cpp_library(force=True)"
          python -c "import doraneural as dn; print('C++ Backend Available:', dn.is_cpp_available())"

      - name: Restore Previous Checkpoint from Cache
        if: ${{ github.event_name == 'push' || github.event.inputs.from_scratch != 'true' }}
        uses: actions/cache/restore@v4
        id: checkpoint-cache
        with:
          path: zexo/checkpoints/
          key: zexo-checkpoint-${{ github.event.inputs.tier || 'mini' }}-${{ github.ref_name }}
          restore-keys: |
            zexo-checkpoint-${{ github.event.inputs.tier || 'mini' }}-
            zexo-checkpoint-

      - name: Display Checkpoint Status
        run: |
          echo "=== Zexo Checkpoints Directory Status ==="
          mkdir -p zexo/checkpoints
          ls -la zexo/checkpoints/ || true
          if [ -f "zexo/checkpoints/latest.bin" ]; then
            echo "Found previous checkpoint latest.bin ($(wc -c < zexo/checkpoints/latest.bin) bytes). Resuming continuous training!"
          else
            echo "No prior checkpoint in cache. Starting from fresh Zexo base weights."
          fi

      - name: Run Zexo Conversational Training
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          export OMP_NUM_THREADS="$(nproc)"
          DATASET="${{ github.event.inputs.dataset || 'zexo/data/zexo_quality_v1_train.txt' }}"
          if [ ! -f "$DATASET" ]; then
            DATASET="zexo/data/step1_conversational_base.txt"
          fi
          HF_DATASET="${{ github.event.inputs.hf_dataset || '' }}"
          HF_SAMPLES="${{ github.event.inputs.hf_samples || '-1' }}"
          TIER="${{ github.event.inputs.tier || 'mini' }}"
          EPOCHS="${{ github.event.inputs.epochs || '5' }}"
          LR="${{ github.event.inputs.learning_rate || '0.0003' }}"
          SEQLEN="${{ github.event.inputs.seq_len || '128' }}"
          PROMPT="${{ github.event.inputs.test_prompt || 'User: Who are you?\nZexo:' }}"
          FROM_SCRATCH="${{ github.event.inputs.from_scratch || 'false' }}"
          FAST="${{ github.event.inputs.fast || 'true' }}"

          SCRATCH_FLAG=""
          if [ "$FROM_SCRATCH" = "true" ] || [ ! -f "zexo/checkpoints/latest.bin" ]; then
            SCRATCH_FLAG="--from-scratch"
          fi

          FAST_FLAG=""
          if [ "$FAST" != "false" ]; then
            FAST_FLAG="--fast"
          fi

          HF_ARG=""
          if [ -n "$HF_DATASET" ]; then
            HF_ARG="--hf-dataset $HF_DATASET --hf-samples $HF_SAMPLES"
          fi

          python -u zexo/train.py \
            --data "$DATASET" \
            --tier "$TIER" \
            --output-dir zexo/checkpoints \
            --epochs "$EPOCHS" \
            --lr "$LR" \
            --seq-len "$SEQLEN" \
            --test-prompt "$PROMPT" \
            --tag "zexo_run_${{ github.run_number }}" \
            $SCRATCH_FLAG \
            $FAST_FLAG \
            $HF_ARG

      - name: Save Updated Checkpoint to Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: zexo/checkpoints/
          key: zexo-checkpoint-${{ github.event.inputs.tier || 'mini' }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Trained Zexo Weights Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zexo-checkpoint-run-${{ github.run_number }}
          path: |
            zexo/checkpoints/latest.bin
            zexo/checkpoints/latest.json
            zexo/checkpoints/zexo_meta.json
            zexo/checkpoints/zexo_run_*.bin
          retention-days: 90
          if-no-files-found: warn

      - name: Commit Updated Checkpoint to Repository (Optional)
        if: ${{ github.event.inputs.push_checkpoint_to_git == 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add zexo/checkpoints/latest.bin zexo/checkpoints/latest.json zexo/checkpoints/zexo_meta.json
          git commit -m "chore(zexo): update trained Zexo checkpoint [skip ci]" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}
